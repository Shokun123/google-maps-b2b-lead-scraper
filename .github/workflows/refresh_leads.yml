name: CI & Lead Dataset Refresh

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Refresh Sample Lead Packs
        run: npm run generate:samples

      - name: Verify CLI Functionality
        run: node bin/cli.js -q "Marketing agencies in New York" -l 5 -f json
